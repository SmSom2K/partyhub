:root{--bg:#f5f4f8;--panel:#fff;--ink:#19162a;--muted:#696578;--line:#e8e5ef;--accent:#e2fb95;--dark:#201b38}body{font-family:Inter,system-ui,sans-serif}.side{background:#17142a}.side small{color:#aba4c6}.nav button{color:#c9c3dc;display:flex;align-items:center;gap:12px}.nav button.active{background:#393052;box-shadow:inset 3px 0 #e2fb95}.nav svg{width:19px;height:19px;flex:none}.main{padding:34px 40px}.card{border-radius:22px;box-shadow:0 5px 25px #21173e08}.hero{isolation:isolate;background:linear-gradient(120deg,#21183e,#4b3275);padding:38px;min-height:235px}.hero:after{display:none}.hero> :not(.orbit){position:relative;z-index:1}.hero p{color:#ded5f2}.orbit{position:absolute;right:-35px;top:50%;width:340px;height:340px;transform:translateY(-50%);pointer-events:none;opacity:.8;z-index:-1}.orbit span{position:absolute;inset:var(--inset);border:1px solid #e2fb9555;border-radius:50%;transform:rotate(-25deg) scaleY(.65)}.orbit span:after{content:'';position:absolute;top:50%;left:-5px;width:10px;height:10px;background:#e2fb95;border-radius:50%;box-shadow:0 0 20px #e2fb95}.orb{position:absolute;inset:100px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#f0ffb8,#9ca7ed 45%,#654499 75%);box-shadow:0 0 75px #bca5ff55}.landing{max-width:1280px;padding:36px}.landing .hero{min-height:480px;padding:65px 48px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.landing .hero h1{max-width:790px}.landing .hero p{max-width:490px;font-size:18px}.landing .orbit{width:440px;height:440px;right:-20px}.landing .grid .card{min-height:185px;padding:26px}.landing .grid .eyebrow{color:#7661a2;margin-bottom:18px}.stat{position:relative;overflow:hidden}.stat:after{content:'';position:absolute;right:15px;top:17px;width:10px;height:10px;background:#987bd8;border-radius:50%}.stat:nth-child(2):after{background:#83a447}.stat:nth-child(3):after{background:#e493aa}.stat:nth-child(4):after{background:#e6ad67}.bar i{background:linear-gradient(90deg,#8265c7,#a5c765);transform-origin:left}.toast{box-shadow:0 10px 40px #0003}.dark{--bg:#141221;--panel:#211d32;--ink:#f4efff;--muted:#bab2ce;--line:#39334c}.dark .pill,.dark .avatar,.dark button.secondary{background:#38324b;color:#f3ecff}.item{flex-wrap:wrap}.item .grow{min-width:110px}button{transition:transform .15s,opacity .15s,background .15s}button:active{transform:scale(.96)}.nav button:hover{background:#302840}.landing .hero button{margin-top:8px}.landing .hero button.secondary{background:#ffffff18;color:white;border:1px solid #ffffff50}.guest .hero .orbit{opacity:.22}.guest .hero{padding:48px 24px}.stat strong{font-variant-numeric:tabular-nums}.motion-toggle{position:fixed;bottom:15px;left:15px;z-index:6;font-size:12px;background:#393052;color:white}.side footer{padding-bottom:35px}.eq{display:flex;gap:5px;align-items:center;height:35px;margin-top:15px}.eq i{width:5px;height:27px;background:#e2fb95;border-radius:8px;transform:scaleY(.35);animation:beat 1.2s ease-in-out infinite alternate;animation-delay:var(--delay)}@keyframes beat{to{transform:scaleY(1)}}@keyframes orbit{to{rotate:360deg}}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:no-preference){.card,.hero{animation:none}.enter .card,.enter .hero{animation:rise .48s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--delay,0ms)}.orbit span{animation:orbit 22s linear infinite;animation-delay:var(--delay)}.bar i{animation:fill .55s ease-out}.toast:not(.hidden){animation:pop .25s ease-out}.landing .card:hover{transform:translateY(-5px);transition:transform .25s}.landing .hero .orb{animation:float 5s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-12px)}}}body.still *,body.still *:before,body.still *:after{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:850px){.main,.landing{padding:18px}.landing .hero{padding:35px 25px;min-height:390px}.hero .orbit{opacity:.25;right:-140px}.motion-toggle{position:static;margin:12px 18px}.side footer{display:none}.nav button{gap:6px}.nav svg{width:16px;height:16px}}@media(max-width:480px){.form{align-items:stretch}.form input{flex-basis:100%}.item select{max-width:125px}.hero{padding:25px}.stat strong{font-size:30px}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden" role="status"></div><script type="module">
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), id=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), key='eventhub-studio-v2';
const seed=()=>({event:{name:'Maya & Jordan’s Wedding',date:'2027-06-19',time:'18:00',venue:'The Garden Hall',details:'Parking is behind the building.',capacity:120,karaoke:'',songs:true,media:true,rsvp:true},guests:[{id:id(),name:'Priya Shah',count:2,status:'yes',table:'1'},{id:id(),name:'Marcus Lee',count:1,status:'pending',table:''},{id:id(),name:'Ana Torres',count:3,status:'no',table:''}],songs:[{id:id(),name:'September',artist:'Earth, Wind & Fire',votes:2,played:false},{id:id(),name:'Don’t Stop Believin’',artist:'Journey',votes:1,played:false}],tasks:['Confirm venue arrival time','Send invitations','Print guest QR code','Finalize do-not-play list','Brief MC'].map((name,i)=>({id:id(),name,done:i<2})),timeline:[{id:id(),time:'18:00',name:'Guest arrival'},{id:id(),time:'19:00',name:'Dinner'},{id:id(),time:'20:30',name:'Dance floor opens'}]});let S;try{S=JSON.parse(localStorage.getItem(key))||seed()}catch{S=seed()}let page=location.hash.slice(1)||'home',media=[],search='',toastTimer;const nav=['Overview','Guests','Music','Gallery','Timeline','Checklist','Settings'];const save=()=>{try{localStorage.setItem(key,JSON.stringify(S));return true}catch{notify('Storage unavailable. Changes may not survive refresh.');return false}};function notify(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}function go(p){location.hash=p}window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'home';search='';render()});window.addEventListener('storage',e=>{if(e.key===key&&e.newValue){try{S=JSON.parse(e.newValue);render()}catch{}}});
const btn=(text,action,cls='secondary')=>`<button class="${cls}" data-action="${action}">${text}</button>`, empty=t=>`<div class="empty">${t}</div>`, card=(title,body,extra='')=>`<section class="card section"><div class="head"><h2>${title}</h2>${extra}</div>${body}</section>`, row=(a,b='',c='')=>`<div class="item"><div class="grow"><strong>${a}</strong>${b?`<div class="muted">${b}</div>`:''}</div>${c}</div>`, field=(label,name,value='',type='text')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" required></label>`;const queue=()=>S.songs.filter(x=>!x.played).sort((a,b)=>b.votes-a.votes), attending=()=>S.guests.filter(g=>g.status==='yes').reduce((a,g)=>a+g.count,0), progress=()=>S.tasks.length?Math.round(S.tasks.filter(t=>t.done).length/S.tasks.length*100):0;
function songRows(guest=false,played=false){return (played?S.songs.filter(s=>s.played):queue()).map(s=>row(esc(s.name),esc(s.artist),`<span class="pill">${s.votes} votes</span>${guest?btn('+1','vote:'+s.id):btn(played?'Restore':'Played','play:'+s.id)}${guest?'':btn('×','deleteSong:'+s.id,'danger')}`)).join('')||empty('No songs here yet.')}
const songForm=()=>`<form data-form="song" class="form"><input name="name" placeholder="Song title" required maxlength="100"><input name="artist" placeholder="Artist" required maxlength="100"><button>Request</button></form>`;
function gallery(){return `<div class="gallery">${media.map(m=>`<article>${m.type.startsWith('video/')?`<video controls src="${m.url}"></video>`:`<img src="${m.url}" alt="${esc(m.name)}">`}<small>${esc(m.name)}</small><div class="actions"><a href="${m.url}" download="${esc(m.name)}">Save</a>${page==='guest'?'':btn('Remove','media:'+m.id,'danger')}</div></article>`).join('')}</div>${media.length?'':empty('No memories uploaded yet.')}`}
function overview(){return `<div class="hero"><div class="eyebrow">Your event workspace</div><h1>${esc(S.event.name)}</h1><p>${esc(S.event.date)} · ${esc(S.event.venue)}</p>${btn('Open guest preview ↗','go:guest','')}</div><div class="stats">${[['Invited households',S.guests.length],['Confirmed guests',attending()],['Song requests',queue().reduce((a,s)=>a+s.votes,0)],['Memories',media.length]].map(([n,v])=>`<div class="card stat"><small>${n}</small><strong>${v}</strong></div>`).join('')}</div><div class="grid">${card('Event readiness',`<h1>${progress()}%</h1><div class="bar"><i style="width:${progress()}%"></i></div>${S.tasks.slice(0,4).map(t=>row(esc(t.name),'',`<input aria-label="Complete ${esc(t.name)}" type="checkbox" data-task="${t.id}" ${t.done?'checked':''}>`)).join('')}`,btn('View all','go:checklist'))}${card('Most requested',songRows(),btn('Music desk','go:music'))}${card('Guest attendance',`<h1>${attending()} / ${S.event.capacity}</h1><div class="bar"><i style="width:${Math.min(100,attending()/S.event.capacity*100)}%"></i></div><p class="muted">${S.guests.filter(g=>g.status==='pending').length} households awaiting RSVP</p>`,btn('Manage','go:guests'))}${card('Run of show',timelineRows(false),btn('Timeline','go:timeline'))}</div>`}
function timelineRows(edit=true){return [...S.timeline].sort((a,b)=>a.time.localeCompare(b.time)).map(t=>row(esc(t.name),esc(t.time),edit?btn('Remove','deleteTime:'+t.id,'danger'):'')).join('')||empty('No scheduled activities.')}
function guests(){return card('Guest directory',`<form data-form="guest" class="form"><input name="name" required placeholder="Guest or household name"><input name="count" type="number" min="1" max="100" value="1" aria-label="Party size" required><button>Add guest</button></form><div class="list">${S.guests.map(g=>row(esc(g.name),`${g.count} invited`, `<select aria-label="RSVP status" data-status="${g.id}">${['pending','yes','no'].map(s=>`<option value="${s}" ${s===g.status?'selected':''}>${({pending:'Pending',yes:'Coming',no:'Declined'})[s]}</option>`).join('')}</select><input aria-label="Table assignment" placeholder="Table" style="width:80px" data-table="${g.id}" value="${esc(g.table)}">${btn('×','deleteGuest:'+g.id,'danger')}`)).join('')||empty('No guests yet.')}</div>`,btn('Export CSV','csv'))}
function settings(){let e=S.event;return card('Event details',`<form data-form="settings">${field('Event name','name',e.name)}${field('Date','date',e.date,'date')}${field('Time','time',e.time,'time')}${field('Venue','venue',e.venue)}${field('Capacity','capacity',e.capacity,'number')}<label class="field">Arrival information<textarea name="details">${esc(e.details)}</textarea></label><label class="field">Karaoke link (optional)<input type="url" name="karaoke" value="${esc(e.karaoke)}"></label>${['songs','media','rsvp'].map(k=>`<label class="item"><input type="checkbox" name="${k}" ${e[k]?'checked':''}> Enable ${k}</label>`).join('')}<button>Save event</button></form>`)+card('Data & sharing',`<p class="muted">Local workspace. A guest link opens the guest interface, but does not synchronize data between devices.</p><div class="actions" style="margin-top:15px">${btn('Copy guest link','copy')}${btn('Export event JSON','backup')}${btn('Reset sample data','reset','danger')}</div>`)}
function guest(){let e=S.event;return `<div class="guest"><div class="hero"><div class="eyebrow">Guest preview · local edition</div><h1>${esc(e.name)}</h1><p>${esc(e.date)} · ${esc(e.time)} · ${esc(e.venue)}</p><p>${esc(e.details)}</p></div>${e.rsvp?card('Will you be joining us?',`<form data-form="rsvp">${field('Your name','name')}<label class="field">Party size<input type="number" name="count" min="1" max="100" value="1" required></label><div class="actions"><button name="status" value="yes">I’m coming</button><button class="secondary" name="status" value="no">Can’t make it</button></div></form>`):''}${e.songs?card('Make the dance floor yours',songForm()+songRows(true)):''}${e.media?card('Capture the moment',`<input type="file" id="upload" accept="image/*,video/*" multiple>${gallery()}`):''}${card('Find your table',`<form data-form="table" class="form"><input name="name" placeholder="Your full name" required><button>Find table</button></form><p id="tableResult" aria-live="polite"></p>`)}${card('What’s happening',timelineRows(false))}${e.karaoke&&/^https?:\/\//i.test(e.karaoke)?card('Karaoke',`<a href="${esc(e.karaoke)}" target="_blank" rel="noopener">Open karaoke sign-up ↗</a>`):''}</div>`}
function renderBase(){let content; if(page==='home'){$('#app').innerHTML=`<div class="landing"><div class="top"><div class="brand">event<i style="color:#63813b">hub.</i><div class="eyebrow">Your Party DJ Services</div></div>${btn('Open workspace','go:overview','')}</div><div class="hero"><div class="eyebrow">Every moment. One place.</div><h1>Less planning chaos.<br>More unforgettable nights.</h1><p>Bring your guests, music and memories together in one beautifully simple event workspace.</p>${btn('Explore Event Hub ↗','go:overview','')} ${btn('Guest preview','go:guest')}</div><div class="grid">${[['01 / Guests','Make every invitation count','RSVPs, party sizes and seating in one directory.'],['02 / Music','Let the crowd set the mood','Song requests, voting and a dedicated DJ queue.'],['03 / Memories','Keep the moments that matter','Collect photos and videos in a shared local album.']].map(([n,t,d])=>`<div class="card"><div class="eyebrow">${n}</div><h2>${t}</h2><p class="muted">${d}</p></div>`).join('')}</div><p class="muted" style="margin-top:25px">Interactive local edition · No account required for this preview</p></div>`;return}switch(page){case'guest':content=guest();break;case'guests':content=guests();break;case'music':content=`<div class="hero"><div class="eyebrow">DJ desk / up next</div><h1>${esc(queue()[0]?.name||'Queue is clear')}</h1><p>${esc(queue()[0]?.artist||'Waiting for requests')}</p>${queue().length?btn('Mark played','play:'+queue()[0].id,''):''}</div>${card('Request queue',songForm()+songRows())}${card('Played history',songRows(false,true))}`;break;case'gallery':content=card('Event album',`<input type="file" id="upload" accept="image/*,video/*" multiple>${gallery()}`);break;case'timeline':content=card('Run of show',`<form data-form="timeline" class="form"><input type="time" name="time" required><input name="name" placeholder="Activity" required><button>Add</button></form>${timelineRows()}`);break;case'checklist':content=card('Planning checklist',`<div class="bar"><i style="width:${progress()}%"></i></div><p>${progress()}% complete</p><form data-form="task" class="form"><input name="name" required placeholder="New task"><button>Add</button></form>${S.tasks.map(t=>row(esc(t.name),'',`<input type="checkbox" aria-label="Complete task" data-task="${t.id}" ${t.done?'checked':''}>${btn('×','deleteTask:'+t.id,'danger')}`)).join('')}`);break;case'settings':content=settings();break;default:content=overview()}
$('#app').innerHTML=`<div class="shell"><aside class="side"><div><div class="brand">event<i>hub.</i></div><small>Your Party DJ Services</small></div><div class="nav">${nav.map(n=>`<button class="${page===n.toLowerCase()?'active':''}" data-action="go:${n.toLowerCase()}">${n}</button>`).join('')}</div><footer><small>LOCAL WORKSPACE</small><p>Event Hub Studio</p></footer></aside><main class="main"><div class="top"><div><div class="eyebrow">Event Hub / ${esc(page)}</div><h2>${page==='guest'?'Guest experience':page[0].toUpperCase()+page.slice(1)}</h2></div><div class="right">${btn('Home','go:home')}${btn('Theme','theme')}${btn(page==='guest'?'Host view':'Guest view','go:'+(page==='guest'?'overview':'guest'),'')}</div></div>${content}</main></div>`}

const paths=['M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M22 21v-2a4 4 0 0 0-3-4','M9 18V5l12-2v13 M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3 M21 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3','M3 3h18v18H3z M3 17l6-6 4 4 3-3 5 5 M15 7h2','M3 6h18v15H3z M7 3v6 M17 3v6 M3 11h18','M4 6l2 2 4-4 M12 6h8 M4 13l2 2 4-4 M12 13h8 M12 20h8','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2'];
let lastPage=null;function render(){let fresh=lastPage!==page;lastPage=page;renderBase();let app=$('#app');if(fresh)app.classList.add('enter');else app.classList.remove('enter');app.querySelectorAll('.card,.hero').forEach((c,i)=>c.style.setProperty('--delay',Math.min(i,8)*55+'ms'));app.querySelectorAll('.hero').forEach(h=>{let o=document.createElement('div');o.className='orbit';o.setAttribute('aria-hidden','true');o.innerHTML=[0,25,50,75].map((n,i)=>`<span style="--inset:${n}px;--delay:${-i*4}s"></span>`).join('')+'<div class="orb"></div>';h.prepend(o)});app.querySelectorAll('.nav button').forEach((b,i)=>b.insertAdjacentHTML('afterbegin',`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[i]}"/></svg>`));if(page==='music'){let h=app.querySelector('.hero');h.insertAdjacentHTML('beforeend','<div class="eq" aria-hidden="true">'+Array.from({length:18},(_,i)=>`<i style="--delay:${-(i%7)*.16}s"></i>`).join('')+'</div>')}let toggle=document.createElement('button');toggle.className='motion-toggle';toggle.textContent=document.body.classList.contains('still')?'Motion: off':'Motion: on';toggle.setAttribute('aria-pressed',String(!document.body.classList.contains('still')));toggle.onclick=()=>{let off=document.body.classList.toggle('still');toggle.textContent=off?'Motion: off':'Motion: on';toggle.setAttribute('aria-pressed',String(!off));try{localStorage.setItem('eh-motion',off?'off':'on')}catch{}};app.append(toggle)}

function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
let db;const ready=new Promise((resolve,reject)=>{let r=indexedDB.open('eventhub-media-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)});async function mediaOp(mode,fn){await ready;return new Promise((resolve,reject)=>{let t=db.transaction('files',mode),r=fn(t.objectStore('files'));t.oncomplete=()=>resolve(r.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}async function loadMedia(){let rows=await mediaOp('readonly',s=>s.getAll());media.forEach(m=>URL.revokeObjectURL(m.url));media=rows.map(m=>({...m,url:URL.createObjectURL(m.blob)}));render()}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let [a,k]=b.dataset.action.split(':');if(a==='go'){go(k);return}if(a==='theme'){document.body.classList.toggle('dark');try{localStorage.setItem('eh-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}return}if(a==='copy'){try{await navigator.clipboard.writeText(location.href.split('#')[0]+'#guest');notify('Guest link copied (local data only).')}catch{notify('Clipboard unavailable. Copy the guest page address.')}return}if(a==='backup'){download('eventhub.json',JSON.stringify(S,null,2),'application/json');return}if(a==='csv'){let q=v=>'"'+String(v).replace(/^[=+\-@\t\r]/,"'$&").replaceAll('"','""')+'"';download('guests.csv',['Name,Party size,Status,Table',...S.guests.map(g=>[g.name,g.count,g.status,g.table].map(q).join(','))].join('\n'),'text/csv');return}if(a==='media'){try{await mediaOp('readwrite',s=>s.delete(k));await loadMedia()}catch{notify('Could not remove file')}return}if(a==='reset'){if(!confirm('Reset event data to the sample? Media will be retained.'))return;S=seed()}if(a==='vote'){let s=S.songs.find(x=>x.id===k);if(s)s.votes++}if(a==='play'){let s=S.songs.find(x=>x.id===k);if(s)s.played=!s.played}for(let [action,prop] of [['deleteSong','songs'],['deleteGuest','guests'],['deleteTask','tasks'],['deleteTime','timeline']])if(a===action)S[prop]=S[prop].filter(x=>x.id!==k);save();render()});
document.addEventListener('submit',e=>{let f=e.target;if(!f.dataset.form)return;e.preventDefault();let d=Object.fromEntries(new FormData(f)),n=d.name?.trim();if(d.name!==undefined&&!n){notify('Enter a name first.');return}switch(f.dataset.form){case'song':{let artist=d.artist.trim();if(!artist)return;let s=queue().find(s=>s.name.toLowerCase()===n.toLowerCase()&&s.artist.toLowerCase()===artist.toLowerCase());if(s)s.votes++;else S.songs.push({id:id(),name:n,artist,votes:1,played:false});break}case'guest':case'rsvp':{let g=S.guests.find(g=>g.name.toLowerCase()===n.toLowerCase()),status=f.dataset.form==='rsvp'?(e.submitter?.value||'yes'):'pending';if(g){g.count=Number(d.count);if(f.dataset.form==='rsvp')g.status=status}else S.guests.push({id:id(),name:n,count:Number(d.count),status,table:''});break}case'task':S.tasks.push({id:id(),name:n,done:false});break;case'timeline':S.timeline.push({id:id(),name:n,time:d.time});break;case'settings':if(!Number.isInteger(+d.capacity)||+d.capacity<1){notify('Capacity must be a positive whole number.');return}S.event={...d,name:n,capacity:+d.capacity,songs:!!d.songs,media:!!d.media,rsvp:!!d.rsvp};break;case'table':{let g=S.guests.find(g=>g.name.toLowerCase()===n.toLowerCase());$('#tableResult').textContent=g?.table?'Your table: '+g.table:'No table assigned for this name.';return}}if(save())notify('Saved successfully');render()});
document.addEventListener('change',async e=>{let t=e.target;if(t.dataset.task){let x=S.tasks.find(x=>x.id===t.dataset.task);if(x)x.done=t.checked}else if(t.dataset.status){let x=S.guests.find(x=>x.id===t.dataset.status);if(x)x.status=t.value}else if(t.dataset.table){let x=S.guests.find(x=>x.id===t.dataset.table);if(x)x.table=t.value.trim()}else if(t.id==='upload'){let files=[...t.files],count=0;for(let f of files){if(!/^(image|video)\//.test(f.type)||f.size>50*1024*1024)continue;try{await mediaOp('readwrite',s=>s.put({id:id(),name:f.name,type:f.type,blob:f}));count++}catch{}}try{await loadMedia()}catch{}notify(`${count} of ${files.length} files saved locally (50 MB per file).`);return}else return;save();render()});try{if(localStorage.getItem('eh-motion')==='off'||matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('still')}catch{}try{if(localStorage.getItem('eh-theme')==='dark')document.body.classList.add('dark')}catch{}render();loadMedia().catch(()=>notify('Media storage unavailable in this browser.'));
</script></body></html>
